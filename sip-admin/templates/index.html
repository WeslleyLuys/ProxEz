      <a href="#" class="nav-item" data-page="api-backend">

      <a href="#" class="nav-item" data-page="rotas">

      <a href="#" class="nav-item" data-page="cache">

      <a href="#" class="nav-item" data-page="sip-capture">

      <a href="#" class="nav-item" data-page="monitor">

      <div class="status-dot running" id="status-dot"></div>

    <!-- Usuário logado + logout -->

      <div class="sidebar-user-info">
        <span class="sidebar-user-icon">◉</span>
        <span id="sidebar-username">...</span>
      </div>

  <!-- Main Content -->

        <button class="btn btn-sm btn-danger" onclick="confirmRestart()">↻ Restart Kamailio</button>

<!-- Toast -->
<div id="toast-container"></div>

<!-- Modal Confirmar -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-title" id="modal-title">Confirmar</div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="modal-confirm-btn">Confirmar</button>
    </div>
  </div>
</div>

<audio id="wp-audio" autoplay></audio>
<script src="/static/app.js?v=6"></script>
<script>
// Carrega nome do usuário logado e aplica permissões.
fetch('/api/auth/me').then(r => {
  if (r.status === 401) { window.location.href = '/login'; return null; }
  return r.json();
}).then(d => {
  if (!d) return;
  document.getElementById('sidebar-username').textContent = d.name || d.username;
  // Armazena permissões em escopo global.
  window.userPermissions = d.permissions || ['*'];
  // Filtra o menu lateral conforme as permissões do usuário.
  if (!window.userPermissions.includes('*')) {
    document.querySelectorAll('.nav-item').forEach(el => {
      const page = el.dataset.page;
      if (page === 'dashboard') return; // O dashboard é sempre visível.
      if (!window.userPermissions.includes(page)) {
        el.style.display = 'none';
      }
    });
    // Oculta botões administrativos quando o usuário não tem permissão total.
    const restartBtn = document.querySelector('.btn-danger[onclick="confirmRestart()"]');
    if (restartBtn) restartBtn.style.display = 'none';
  }
});

// Intercepta respostas 401 de qualquer chamada de API
const _origFetch = window.fetch;
window.fetch = function(...args) {
  return _origFetch(...args).then(res => {
    if (res.status === 401 && !args[0].toString().includes('/login')) {
      window.location.href = '/login';
    }
    return res;
  });
};

async function doLogout() {
  await fetch('/logout', { method: 'POST' });
  window.location.href = '/login';
}
</script>
</body>
</html>
