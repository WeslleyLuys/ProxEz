<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SIP Proxy Admin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0b0f1a;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

/* fundo animado */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(79,142,247,.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 20%, rgba(139,92,246,.07) 0%, transparent 50%);
  pointer-events: none;
}

.login-wrap {
  width: 100%;
  max-width: 380px;
  padding: 24px;
  position: relative;
  z-index: 1;
}

.brand {
  text-align: center;
  margin-bottom: 32px;
}

.brand-icon {
  font-size: 36px;
  display: block;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 12px rgba(79,142,247,.5));
}

.brand-name {
  font-size: 22px;
  font-weight: 700;
  color: #e2e8f0;
  letter-spacing: .03em;
}

.brand-sub {
  font-size: 12px;
  color: #4f6282;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: .1em;
}

.card {
  background: rgba(22, 27, 39, 0.95);
  border: 1px solid rgba(79,142,247,.15);
  border-radius: 14px;
  padding: 32px;
  box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.03);
  backdrop-filter: blur(10px);
}

.form-title {
  font-size: 16px;
  font-weight: 600;
  color: #94a3b8;
  margin-bottom: 24px;
  text-align: center;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 11px;
  color: #4f6282;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 6px;
}

input {
  width: 100%;
  background: rgba(15,20,30,.8);
  border: 1px solid rgba(79,142,247,.2);
  border-radius: 8px;
  color: #e2e8f0;
  padding: 10px 14px;
  font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

input:focus {
  border-color: rgba(79,142,247,.6);
  box-shadow: 0 0 0 3px rgba(79,142,247,.1);
}

input::placeholder { color: #2a3a5a; }

.btn-login {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  background: linear-gradient(135deg, #4f8ef7, #6c63ff);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s, transform .1s;
  letter-spacing: .03em;
}

.btn-login:hover  { opacity: .9; }
.btn-login:active { transform: scale(.98); }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }

.error-msg {
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.3);
  border-radius: 7px;
  color: #fca5a5;
  font-size: 13px;
  padding: 10px 14px;
  margin-top: 14px;
  display: none;
  text-align: center;
}

.footer-note {
  text-align: center;
  font-size: 11px;
  color: #1e2d45;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="brand">
    <span class="brand-icon">◈</span>
    <div class="brand-name">SIP Proxy Admin</div>
    <div class="brand-sub">OmniSmart Telecom</div>
  </div>

  <div class="card">
    <div class="form-title">Acesso ao Painel</div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="field">
        <label>Usuário</label>
        <input id="username" type="text" placeholder="admin" autocomplete="username" autofocus />
      </div>
      <div class="field">
        <label>Senha</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-login" id="btn-login" type="submit">Entrar</button>
      <div class="error-msg" id="error-msg"></div>
    </form>
  </div>

  <div class="footer-note">SIP Proxy · Kamailio · OmniSmart © 2026</div>
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error-msg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Aguarde...';

  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.ok) {
      window.location.href = '/';
    } else {
      err.textContent = data.error || 'Erro ao autenticar';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  } catch (ex) {
    err.textContent = 'Erro de conexão com o servidor';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
